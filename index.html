<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Blok Puzzle 500 Level</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0f2e">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:system-ui, sans-serif; color:#fff; user-select:none; touch-action:manipulation; }
  body { background:#111; transition:background .6s; }
  #game { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px; }
  #hud { width:min(96vw,440px); background:rgba(0,0,0,.35); padding:6px 10px; border-radius:10px; font-size:13px; }
  #baris1 { display:flex; justify-content:space-between; align-items:center; }
  #hud button { background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:8px; padding:4px 10px; font-size:13px; }
  #bar { height:6px; background:rgba(255,255,255,.2); border-radius:3px; margin-top:6px; overflow:hidden; }
  #isi { height:100%; width:0; background:#ffd166; transition:width .3s; }
  #area { display:flex; gap:10px; align-items:flex-start; justify-content:center; flex:1; min-height:0; }
  canvas#papan { display:block; height:min(56vh,520px); width:auto; aspect-ratio:1/2; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,.4); }
  #samping { width:80px; display:flex; flex-direction:column; gap:8px; }
  .kotak { background:rgba(0,0,0,.35); border-radius:8px; padding:6px; text-align:center; font-size:12px; }
  canvas#next { display:block; width:60px; height:60px; margin:4px auto 0; }
  #kontrol { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(96vw,440px); }
  #kontrol button { height:54px; border:none; border-radius:12px; background:rgba(255,255,255,.25); color:#fff; font-size:20px; }
  #kontrol button.jatuh { background:#ff9f1c; color:#111; font-size:16px; font-weight:bold; }
  .layar { position:fixed; inset:0; background:rgba(8,8,20,.94); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; padding:16px; overflow:auto; }
  .layar h1 { font-size:24px; margin:0; color:#ffd166; text-align:center; }
  .layar p { margin:0; text-align:center; color:#ccd; font-size:14px; }
  .layar button { width:min(80vw,320px); padding:12px; border:none; border-radius:10px; background:#4f8cff; color:#fff; font-size:16px; }
  .tema-btn { background:#2b3a6e !important; }
  #akhir { display:none; }
  #pesan { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); padding:6px 14px;
    border-radius:8px; font-size:13px; display:none; white-space:nowrap; }
</style>
</head>
<body>

<div id="game">
  <div id="hud">
    <div id="baris1">
      <span>Level <b id="lvl">1</b>/500</span>
      <span>Skor <b id="skorLevel">0</b>/2000</span>
      <button id="btnSuara">🔊</button>
      <button id="btnMenu">Menu</button>
    </div>
    <div id="bar"><div id="isi"></div></div>
  </div>
  <div id="area">
    <canvas id="papan"></canvas>
    <div id="samping">
      <div class="kotak">Berikutnya<canvas id="next" width="60" height="60"></canvas></div>
      <div class="kotak">Tema<br><b id="namaTema"></b></div>
    </div>
  </div>
  <div id="kontrol">
    <button data-a="kiri">◀</button>
    <button data-a="putar">⟳</button>
    <button data-a="turun">▼</button>
    <button data-a="kanan">▶</button>
    <button data-a="jatuh" class="jatuh">⤓</button>
  </div>
</div>

<div id="pesan"></div>

<div id="menu" class="layar">
  <h1>Blok Puzzle 500 Level</h1>
  <p>Pilih latar tema sebelum bermain. Kumpulkan 2000 skor untuk naik level.</p>
  <div id="daftarTema" style="display:flex;flex-direction:column;gap:8px;width:min(80vw,320px)"></div>
</div>

<div id="akhir" class="layar">
  <h1 id="judulAkhir"></h1>
  <p id="teksAkhir"></p>
  <button id="btnUlang">Pilih tema lagi</button>
</div>

<script>
// ===== PENGATURAN =====
const COLS = 10, ROWS = 20, CELL = 22;
const W = COLS * CELL, H = ROWS * CELL;
const MAKS_LEVEL = 500, SKOR_PER_LEVEL = 2000;
const ABU = "#6b6b7b";   // warna balok tantangan

const papanEl = document.getElementById('papan');
papanEl.width = W; papanEl.height = H;
const ctx = papanEl.getContext('2d');
const nctx = document.getElementById('next').getContext('2d');

// Kanvas tersembunyi untuk menyimpan gambar latar tema
const bgCanvas = document.createElement('canvas');
bgCanvas.width = W; bgCanvas.height = H;
const bgCtx = bgCanvas.getContext('2d');

// Generator acak yang bisa diulang: benih yang sama menghasilkan urutan yang sama
function rngDariBenih(s) {
  return function () {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function langit(g, atas, bawah) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, atas); gr.addColorStop(1, bawah);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

// ===== LUKISAN LATAR TEMA =====
function lukisMalamKota(g, r) {
  langit(g, "#0c0f2e", "#3a1f5c");
  g.fillStyle = "#fff3c4"; g.beginPath(); g.arc(W * 0.78, H * 0.12, 9, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#ffffff";
  for (let i = 0; i < 40; i++) g.fillRect(r() * W, r() * H * 0.45, 1.5, 1.5);
  let x = -2;
  while (x < W) {
    const lebar = 22 + r() * 18, tinggi = 70 + r() * 150;
    g.fillStyle = `hsl(${235 + r() * 25},30%,${12 + r() * 8}%)`;
    g.fillRect(x, H - tinggi, lebar, tinggi);
    for (let y = H - tinggi + 6; y < H - 14; y += 8)
      for (let wx = x + 4; wx < x + lebar - 5; wx += 6)
        if (r() < 0.4) { g.fillStyle = "#ffd166"; g.fillRect(wx, y, 2.5, 3.5); }
    x += lebar + 2;
  }
  g.fillStyle = "#15151d"; g.fillRect(0, H - 12, W, 12);
  g.fillStyle = "#ffd166";
  for (let x2 = 0; x2 < W; x2 += 20) g.fillRect(x2, H - 6, 10, 1.5);
}

function lukisLautDalam(g, r) {
  langit(g, "#1790a8", "#02243a");
  g.fillStyle = "rgba(255,255,255,0.06)";
  for (let i = 0; i < 4; i++) {
    const x0 = r() * W;
    g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0 + 25, 0); g.lineTo(x0 + 60 + r() * 30, H); g.lineTo(x0 - 10, H);
    g.closePath(); g.fill();
  }
  g.lineWidth = 3; g.strokeStyle = "#2e8b57";
  for (let i = 0; i < 8; i++) {
    const x0 = r() * W;
    g.beginPath(); g.moveTo(x0, H);
    g.quadraticCurveTo(x0 + (r() - 0.5) * 30, H - H * 0.3, x0 + (r() - 0.5) * 14, H - H * 0.1 - r() * H * 0.35);
    g.stroke();
  }
  g.fillStyle = "#3b4a5a";
  for (let i = 0; i < 4; i++) { g.beginPath(); g.ellipse(r() * W, H - 4, 14 + r() * 12, 8 + r() * 6, 0, Math.PI, 0); g.fill(); }
  g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 1;
  for (let i = 0; i < 14; i++) { g.beginPath(); g.arc(r() * W, r() * H, 2 + r() * 4, 0, Math.PI * 2); g.stroke(); }
  for (let i = 0; i < 3; i++) {
    const x0 = 20 + r() * (W - 40), y0 = H * 0.2 + r() * H * 0.5;
    g.fillStyle = "#ffb703";
    g.beginPath(); g.ellipse(x0, y0, 8, 4, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(x0 - 7, y0); g.lineTo(x0 - 14, y0 - 4); g.lineTo(x0 - 14, y0 + 4); g.fill();
  }
}

function lukisHutanAjaib(g, r) {
  langit(g, "#a8e6a1", "#2d6a4f");
  for (let i = 0; i < 4; i++) {
    const x0 = r() * W, y0 = H - 40 - r() * 60;
    g.fillStyle = "#6b4226"; g.fillRect(x0 - 3, y0, 6, H - y0);
    g.fillStyle = "#2f7d32";
    g.beginPath(); g.arc(x0, y0 - 4, 14 + r() * 6, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < 4; i++) {
    const x0 = 8 + r() * (W - 16);
    g.fillStyle = "#f5f5dc"; g.fillRect(x0 - 2, H - 18, 4, 18);
    g.fillStyle = "#e63946"; g.beginPath(); g.arc(x0, H - 18, 7, Math.PI, 0); g.fill();
    g.fillStyle = "#fff"; g.fillRect(x0 - 4, H - 22, 2, 2); g.fillRect(x0 + 2, H - 20, 2, 2);
  }
  g.fillStyle = "#1b5e20"; g.fillRect(0, H - 6, W, 6);
  g.fillStyle = "#fff176";
  for (let i = 0; i < 18; i++) { g.beginPath(); g.arc(r() * W, r() * H * 0.8, 1.5, 0, Math.PI * 2); g.fill(); }
}

function lukisAngkasa(g, r) {
  langit(g, "#2a0845", "#000010");
  const neb = g.createRadialGradient(W * 0.3, H * 0.3, 5, W * 0.3, H * 0.3, W * 0.8);
  neb.addColorStop(0, "rgba(180,60,220,.35)"); neb.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = neb; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fff";
  for (let i = 0; i < 60; i++) g.fillRect(r() * W, r() * H, r() < 0.2 ? 2 : 1, r() < 0.2 ? 2 : 1);
  g.fillStyle = "#e09f3e"; g.beginPath(); g.arc(W * 0.7, H * 0.7, 14, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,230,180,.7)"; g.lineWidth = 3;
  g.beginPath(); g.ellipse(W * 0.7, H * 0.7, 24, 6, -0.3, 0, Math.PI * 2); g.stroke();
  g.fillStyle = "#4cc9f0"; g.beginPath(); g.arc(W * 0.2, H * 0.55, 7, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(W * 0.5, H * 0.1); g.lineTo(W * 0.42, H * 0.16); g.stroke();
}

function lukisPadangPasir(g, r) {
  langit(g, "#ffd27f", "#e76f51");
  g.fillStyle = "#fff3b0"; g.beginPath(); g.arc(W * 0.75, H * 0.14, 16, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#e9b872"; g.beginPath(); g.ellipse(W * 0.25, H * 0.85, W * 0.7, H * 0.14, 0, Math.PI, 0); g.fill();
  g.fillStyle = "#d89c52"; g.beginPath(); g.ellipse(W * 0.85, H * 0.92, W * 0.6, H * 0.12, 0, Math.PI, 0); g.fill();
  g.fillStyle = "#c08a3e";
  g.beginPath(); g.moveTo(W * 0.12, H * 0.82); g.lineTo(W * 0.26, H * 0.6); g.lineTo(W * 0.4, H * 0.82); g.closePath(); g.fill();
  g.fillStyle = "#3d7a3a";
  for (let i = 0; i < 3; i++) {
    const x0 = 10 + r() * (W - 30), y0 = H * 0.8 + r() * H * 0.1;
    g.fillRect(x0, y0 - 22, 5, 22); g.fillRect(x0 - 5, y0 - 12, 5, 4); g.fillRect(x0 + 5, y0 - 16, 5, 4);
  }
}

// ===== DAFTAR TEMA =====
const TEMA = [
  { nama:"Malam Kota", atas:"#0c0f2e", bawah:"#3a1f5c", lukis:lukisMalamKota,
    warna:["#ff6b6b","#feca57","#48dbfb","#1dd1a1","#ff9ff3","#54a0ff","#f368e0"] },
  { nama:"Laut Dalam", atas:"#1790a8", bawah:"#02243a", lukis:lukisLautDalam,
    warna:["#ffd166","#06d6a0","#118ab2","#ef476f","#ffe066","#73d2de","#f4a261"] },
  { nama:"Hutan Ajaib", atas:"#a8e6a1", bawah:"#2d6a4f", lukis:lukisHutanAjaib,
    warna:["#ffb703","#fb8500","#8ac926","#ff595e","#ffca3a","#6a4c93","#ffafcc"] },
  { nama:"Angkasa", atas:"#2a0845", bawah:"#000010", lukis:lukisAngkasa,
    warna:["#f72585","#7209b7","#4cc9f0","#4361ee","#f8961e","#90e0ef","#b5179e"] },
  { nama:"Padang Pasir", atas:"#ffd27f", bawah:"#e76f51", lukis:lukisPadangPasir,
    warna:["#e9c46a","#2a9d8f","#f4a261","#264653","#e76f51","#ffd166","#8ecae6"] }
];

const BENTUK = {
  I:[[1,1,1,1]], O:[[1,1],[1,1]], T:[[0,1,0],[1,1,1]],
  S:[[0,1,1],[1,1,0]], Z:[[1,1,0],[0,1,1]], J:[[1,0,0],[1,1,1]], L:[[0,0,1],[1,1,1]]
};
const NAMA = Object.keys(BENTUK);

// Wilayah untuk balok tantangan (kolom dan baris, termasuk ujungnya)
const WILAYAH = [
  { nama:"kiri atas",     c0:0, c1:3, r0:2,  r1:7 },
  { nama:"kanan atas",    c0:6, c1:9, r0:2,  r1:7 },
  { nama:"kiri tengah",   c0:0, c1:3, r0:8,  r1:13 },
  { nama:"kanan tengah",  c0:6, c1:9, r0:8,  r1:13 },
  { nama:"kiri bawah",    c0:0, c1:3, r0:14, r1:19 },
  { nama:"kanan bawah",   c0:6, c1:9, r0:14, r1:19 },
  { nama:"tengah bawah",  c0:3, c1:6, r0:16, r1:19 }
];

// ===== STATUS =====
let tema = TEMA[0];
let papan, aktif, berikut;
let level = 1, skorLevel = 0, skorTotal = 0;
let kalah = true, jeda = false, timer = null;

function kosong() { return Array.from({ length:ROWS }, () => Array(COLS).fill(null)); }

// Makin tinggi level, makin cepat balok turun (batas minimal 70 md)
function kecepatan(l) { return Math.max(70, 800 - (l - 1) * 1.6); }

function buatBalok() {
  const i = Math.floor(Math.random() * NAMA.length);
  const nama = NAMA[i];
  return { nama, m: BENTUK[nama].map(r => [...r]), x: 3, y: 0, warna: tema.warna[i] };
}

// ===== LOGIKA DASAR =====
function bertabrakan(m, x, y) {
  for (let r = 0; r < m.length; r++) {
    for (let c = 0; c < m[r].length; c++) {
      if (!m[r][c]) continue;
      const nx = x + c, ny = y + r;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && papan[ny][nx]) return true;
    }
  }
  return false;
}

function putar(m) { return m[0].map((_, c) => m.map(row => row[c]).reverse()); }

function hapusBaris() {
  let n = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (papan[r].every(v => v)) {
      papan.splice(r, 1);
      papan.unshift(Array(COLS).fill(null));
      n++; r++;
    }
  }
  return n;
}

function isiDiBaris(r) { return papan[r].filter(v => v).length; }

// Menambahkan balok tantangan di posisi tertentu untuk level ini
function tambahTantangan(l) {
  if (l <= 1) return;
  const r = rngDariBenih(l * 7919);              // benih tetap: susunan sama tiap level
  const jumlah = Math.min(20, 1 + Math.floor(l / 6));
  let ditambah = 0, namaPertama = "";
  for (let i = 0; i < jumlah; i++) {
    const w = WILAYAH[Math.floor(r() * WILAYAH.length)];
    for (let coba = 0; coba < 25; coba++) {
      const c = w.c0 + Math.floor(r() * (w.c1 - w.c0 + 1));
      const y = w.r0 + Math.floor(r() * (w.r1 - w.r0 + 1));
      // Jangan mengisi kotak yang sudah terisi, atau baris yang akan penuh
      if (!papan[y][c] && isiDiBaris(y) < COLS - 1) {
        papan[y][c] = ABU;
        if (!namaPertama) namaPertama = w.nama;
        ditambah++;
        break;
      }
    }
  }
  pesan(`Level ${l}: ${ditambah} balok tantangan muncul di ${namaPertama || "papan"}`, 2500);
}

function kunci() {
  aktif.m.forEach((row, r) => row.forEach((v, c) => {
    if (v && aktif.y + r >= 0) papan[aktif.y + r][aktif.x + c] = aktif.warna;
  }));
SUARA.kunci();
  const n = hapusBaris();
  if (n) { SUARA.baris();
    const tambah = [0, 100, 300, 500, 800][n];
    skorLevel += tambah; skorTotal += tambah;
  }

  aktif = berikut;
  berikut = buatBalok();

  while (skorLevel >= SKOR_PER_LEVEL && !kalah) naikLevel();

  if (!kalah && bertabrakan(aktif.m, aktif.x, aktif.y)) akhirGame(false);
}

function naikLevel() {
  skorLevel -= SKOR_PER_LEVEL;      // sisa skor dibawa ke level berikutnya
  if (level >= MAKS_LEVEL) { akhirGame(true); return; }
  level++;
  SUARA.level();
  tambahTantangan(level);
}

// ===== GERAKAN =====
function gerak(dx) {
  if (!aktif || kalah || jeda) return;
  if (!bertabrakan(aktif.m, aktif.x + dx, aktif.y)) aktif.x += dx;
  gambar();
}

function putarAktif() {
  if (!aktif || kalah || jeda) return;
  const m = putar(aktif.m);
  if (!bertabrakan(m, aktif.x, aktif.y)) aktif.m = m;
  else if (!bertabrakan(m, aktif.x - 1, aktif.y)) { aktif.x--; aktif.m = m; }
  else if (!bertabrakan(m, aktif.x + 1, aktif.y)) { aktif.x++; aktif.m = m; }
  gambar();
}

function turunSatu() {
  if (!aktif || kalah || jeda) return;
  if (!bertabrakan(aktif.m, aktif.x, aktif.y + 1)) aktif.y++;
  else kunci();
  gambar();
}

function jatuhCepat() {
  if (!aktif || kalah || jeda) return;
  while (!bertabrakan(aktif.m, aktif.x, aktif.y + 1)) aktif.y++;
  kunci();
  gambar();
}

function jadwal() {
  clearTimeout(timer);
  if (kalah || jeda) return;
  timer = setTimeout(() => { turunSatu(); jadwal(); }, kecepatan(level));
}

// ===== GAMBAR =====
function kotak(g, px, py, s, warna) {
  const t = Math.max(2, s * 0.14);
  g.fillStyle = warna; g.fillRect(px + 1, py + 1, s - 2, s - 2);
  g.fillStyle = "rgba(255,255,255,.45)"; g.fillRect(px + 2, py + 2, s - 4, t); g.fillRect(px + 2, py + 2, t, s - 4);
  g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(px + 2, py + s - 2 - t, s - 4, t); g.fillRect(px + s - 2 - t, py + 2, t, s - 4);
}

function gambar() {
  ctx.drawImage(bgCanvas, 0, 0);

  ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, H); ctx.stroke(); }
  for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(W, r * CELL); ctx.stroke(); }

  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (papan[r][c]) kotak(ctx, c * CELL, r * CELL, CELL, papan[r][c]);

  if (aktif && !kalah) {
    // Bayangan: posisi jika balok dijatuhkan
    let gy = aktif.y;
    while (!bertabrakan(aktif.m, aktif.x, gy + 1)) gy++;
    ctx.globalAlpha = 0.25;
    aktif.m.forEach((row, r) => row.forEach((v, c) => {
      if (v && gy + r >= 0) kotak(ctx, (aktif.x + c) * CELL, (gy + r) * CELL, CELL, aktif.warna);
    }));
    ctx.globalAlpha = 1;

    aktif.m.forEach((row, r) => row.forEach((v, c) => {
      if (v && aktif.y + r >= 0) kotak(ctx, (aktif.x + c) * CELL, (aktif.y + r) * CELL, CELL, aktif.warna);
    }));
  }

  gambarBerikut();
  updateHUD();
}

function gambarBerikut() {
  nctx.clearRect(0, 0, 60, 60);
  if (!berikut) return;
  const s = 12, m = berikut.m;
  const ox = (60 - m[0].length * s) / 2, oy = (60 - m.length * s) / 2;
  m.forEach((row, r) => row.forEach((v, c) => {
    if (v) kotak(nctx, ox + c * s, oy + r * s, s, berikut.warna);
  }));
}

function updateHUD() {
  document.getElementById('lvl').textContent = level;
  document.getElementById('skorLevel').textContent = skorLevel;
  document.getElementById('isi').style.width = Math.min(100, skorLevel / SKOR_PER_LEVEL * 100) + '%';
}

function pesan(teks, ms = 1800) {
  const el = document.getElementById('pesan');
  el.textContent = teks;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = 'none', ms);
}

// ===== MENU DAN ALUR PERMAINAN =====
function buatMenu() {
  const d = document.getElementById('daftarTema');
  d.innerHTML = '';
  TEMA.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tema-btn';
    b.textContent = t.nama;
    b.onclick = () => mulai(t);
    d.appendChild(b);
  });
}

function bukaMenu() {
  jeda = true;
  clearTimeout(timer);
  document.getElementById('menu').style.display = 'flex';
}

function mulai(t) {
  tema = t;
  document.body.style.background = `linear-gradient(${t.atas}, ${t.bawah})`;
  document.getElementById('namaTema').textContent = t.nama;

  bgCtx.clearRect(0, 0, W, H);
  t.lukis(bgCtx, rngDariBenih(42));          // latar digambar sekali per tema

  papan = kosong();
  level = 1; skorLevel = 0; skorTotal = 0;
  kalah = false; jeda = false;
  aktif = buatBalok();
  berikut = buatBalok();
  document.getElementById('menu').style.display = 'none';
  document.getElementById('akhir').style.display = 'none';
  gambar();
  jadwal();
  pesan('Mulai! Kumpulkan 2000 skor untuk naik level', 2000);
}

  function akhirGame(menang) {
    if (!menang) SUARA.kalah();
  kalah = true;
  clearTimeout(timer);
  document.getElementById('judulAkhir').textContent = menang ? 'Tamat! 500 level selesai' : 'Game Over';
  document.getElementById('teksAkhir').textContent = `Level tercapai: ${level}. Total skor: ${skorTotal}.`;
  document.getElementById('akhir').style.display = 'flex';
  gambar();
}

  // ===== SUARA =====
let suaraAktif = true;
let ac = null;

function bunyi(frek, durasi, tipe = 'square', vol = 0.08) {
  if (!suaraAktif) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = tipe;
    o.frequency.value = frek;
    g.gain.value = vol;
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + durasi);
    o.stop(ac.currentTime + durasi);
  } catch (e) {}
}

const SUARA = {
  kunci: () => bunyi(180, 0.12, 'sawtooth', 0.1),
  baris: () => { bunyi(660, 0.1); setTimeout(() => bunyi(880, 0.15), 90); },
  level: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => bunyi(f, 0.18, 'triangle', 0.1), i * 120)),
  kalah: () => [400, 300, 200].forEach((f, i) => setTimeout(() => bunyi(f, 0.3, 'sawtooth', 0.08), i * 200))
};

document.getElementById('btnSuara').onclick = () => {
  suaraAktif = !suaraAktif;
  document.getElementById('btnSuara').textContent = suaraAktif ? '🔊' : '🔇';
};
